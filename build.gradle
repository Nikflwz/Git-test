plugins {
    id 'java'
    id 'io.qameta.allure' version "4.3.0"
    id 'io.freefair.lombok' version "9.8.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def allureVersion = "2.35.1"

allure{
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "io.qameta.allure:allure-jupiter:$allureVersion"
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation "io.qameta.allure:allure-rest-assured:$allureVersion"
    testImplementation "io.qameta.allure:allure-assertj:$allureVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.codeborne:selenide:7.18.1'
    testImplementation 'net.datafaker:datafaker:2.7.0'
    implementation 'org.aeonbits.owner:owner:1.0.12'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'tools.jackson.core:jackson-databind:3.2.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
    systemProperty 'run', System.getProperty('run', 'local')
    systemProperties System.getProperties()
}