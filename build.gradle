plugins {
    id 'java'
    id 'io.qameta.allure' version "4.3.0"

}

def allureVersion = "2.35.1"

allure{
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "io.qameta.allure:allure-jupiter:$allureVersion"
    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.codeborne:selenide:7.18.1'
    testImplementation 'net.datafaker:datafaker:2.7.0'
}

test {
    useJUnitPlatform()
}